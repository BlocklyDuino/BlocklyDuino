name: Classic workbench

on:
  push:
    branches: [feature/classic-editor-workbench]
  pull_request:
    paths:
      - 'blockly/apps/blocklyduino/**'
      - 'server/**'
      - 'arduino/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/classic-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r server/requirements.txt -r tests/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests/serial-backend-tests -p 'test_*.py' -v
      - run: python tests/run-host.py
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - run: npm ci --ignore-scripts
      - run: python3 tools/install-arduino.py
      - run: python3 tools/compile-examples.py --fqbn arduino:avr:pro:cpu=16MHzatmega168
      - run: python3 tools/compile-pulse-probes.py
